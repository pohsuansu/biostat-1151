<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生物統計學 W04 教學動畫</title>
<style>
:root{
  --ink:#10315A; --ink2:#2B4A72; --soft:#5B7391;
  --accent:#E2703A; --teal:#0E6E77; --ok:#2E7D5B; --warn:#B5452B;
  --bg:#F4F6F9; --card:#FFFFFF; --line:#D9E1EA; --shadow:0 2px 14px rgba(16,49,90,.10);
  --font:"Microsoft JhengHei","PingFang TC","Noto Sans TC","Hiragino Sans TC",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E8EEF6; --ink2:#C3D2E4; --soft:#93A7BF;
    --accent:#FF8F5C; --teal:#49B3BC; --ok:#5FBF92; --warn:#FF8465;
    --bg:#0C1623; --card:#142334; --line:#26384D; --shadow:0 2px 16px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --ink:#E8EEF6; --ink2:#C3D2E4; --soft:#93A7BF;
  --accent:#FF8F5C; --teal:#49B3BC; --ok:#5FBF92; --warn:#FF8465;
  --bg:#0C1623; --card:#142334; --line:#26384D; --shadow:0 2px 16px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
img{max-width:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font);
  -webkit-font-smoothing:antialiased; line-height:1.65;
}

/* ───────── 版面骨架 ───────── */
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 110px}
header.top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
header.top .course{font-size:15px;font-weight:700;color:var(--accent);letter-spacing:.04em}
header.top .sub{font-size:13px;color:var(--soft)}
header.top .spacer{flex:1}
.btn{
  border:1px solid var(--line); background:var(--card); color:var(--ink);
  border-radius:9px; padding:7px 12px; font-family:var(--font); font-size:14px;
  cursor:pointer; line-height:1.2;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{opacity:.9;color:#fff}
.btn.on{background:var(--teal);border-color:var(--teal);color:#fff}
select.sel{max-width:210px;font-size:13px;padding:7px 8px}
select.sel:disabled{opacity:.45}
body.video header.top{display:none}

/* ───────── 舞台 ───────── */
.stage{
  background:var(--card); border:1px solid var(--line); border-radius:18px;
  box-shadow:var(--shadow); padding:22px 24px 26px; min-height:560px;
}
.chip{
  display:inline-block; font-size:12.5px; font-weight:700; letter-spacing:.08em;
  color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, transparent);
  border-radius:999px; padding:3px 11px; margin-bottom:10px;
}
h1.t{font-size:30px; line-height:1.3; margin:0 0 4px; font-weight:800; letter-spacing:-.01em}
.t2{font-size:16px; color:var(--soft); margin:0 0 16px}

.body{display:grid; grid-template-columns:1.22fr .88fr; gap:22px; align-items:start}
.body.stack{grid-template-columns:1fr}
.art{
  background:color-mix(in srgb, var(--ink) 4%, transparent);
  border:1px solid var(--line); border-radius:14px; padding:10px; overflow:hidden;
}
.art svg{display:block;width:100%;height:auto}

ol.lines{list-style:none; margin:0; padding:0; counter-reset:n}
ol.lines li{
  counter-increment:n; position:relative; padding:9px 12px 9px 40px; margin-bottom:7px;
  border-radius:11px; font-size:17.5px; color:var(--ink2);
  opacity:0; transform:translateY(8px); transition:opacity .45s ease, transform .45s ease, background .3s;
}
ol.lines li.on{opacity:1; transform:none}
ol.lines li::before{
  content:counter(n); position:absolute; left:9px; top:11px;
  width:23px; height:23px; border-radius:50%; font-size:12.5px; font-weight:700;
  display:grid; place-items:center; color:#fff; background:var(--soft);
}
ol.lines li.cur{background:color-mix(in srgb, var(--accent) 10%, transparent); color:var(--ink)}
ol.lines li.cur::before{background:var(--accent)}
ol.lines li b{color:var(--accent)}
ol.lines li .hi{color:var(--teal);font-weight:700}
ol.lines li small{display:block;font-size:14.5px;color:var(--soft);margin-top:2px}

.eli5{
  margin-top:18px; border-left:5px solid var(--teal); border-radius:0 12px 12px 0;
  background:color-mix(in srgb, var(--teal) 9%, transparent);
  padding:12px 16px; font-size:18px; font-weight:700; color:var(--ink);
  opacity:0; transform:translateY(8px); transition:opacity .5s, transform .5s;
}
.eli5.on{opacity:1;transform:none}
.eli5 span{display:block;font-size:12.5px;letter-spacing:.1em;color:var(--teal);font-weight:800;margin-bottom:3px}

/* ───────── 控制列 ───────── */
.bar{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  background:color-mix(in srgb, var(--card) 92%, transparent);
  backdrop-filter:blur(8px); border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
}
.bar .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prog{flex:1;min-width:120px;height:7px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.count{font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}

/* ───────── 章節清單 ───────── */
.toc{
  position:fixed; inset:0; z-index:50; background:rgba(8,16,26,.55);
  display:none; padding:24px 16px; overflow:auto;
}
.toc.open{display:block}
.toc .panel{
  max-width:720px;margin:0 auto;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:18px 20px;box-shadow:var(--shadow)
}
.toc h3{margin:0 0 12px;font-size:18px}
.toc ol{margin:0;padding-left:0;list-style:none;counter-reset:c}
.toc li{counter-increment:c;padding:0}
.toc li button{
  width:100%;text-align:left;border:0;background:transparent;color:var(--ink2);
  font-family:var(--font);font-size:15.5px;padding:8px 10px;border-radius:9px;cursor:pointer;
  display:flex;gap:10px;align-items:baseline
}
.toc li button:hover{background:color-mix(in srgb, var(--accent) 10%, transparent);color:var(--ink)}
.toc li button::before{content:counter(c);color:var(--soft);font-size:12.5px;min-width:20px}
.toc li button.now{color:var(--accent);font-weight:700}
.toc li button .k{font-size:12px;color:var(--teal);margin-left:auto}

/* ───────── SVG 通用 ───────── */
[data-at],[data-only]{opacity:0; transition:opacity .55s ease, transform .55s ease}
[data-at].on,[data-only].on{opacity:1}
.svtxt{font-family:var(--font); fill:var(--ink); font-size:15px}
.svsm{font-family:var(--font); fill:var(--soft); font-size:13px}
.svbig{font-family:var(--font); fill:var(--ink); font-size:21px; font-weight:800}
/* pathLength="1" 讓每條曲線不論實際長度，都用滿整段動畫時間 */
.draw.on, .on .draw{animation:dash 1.4s ease both}
@keyframes dash{
  from{stroke-dasharray:1; stroke-dashoffset:1}
  to{stroke-dasharray:1; stroke-dashoffset:0}
}
.pop.on, .on > .pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
.grow.on, .on > .grow{animation:grow .9s ease both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* ───────── 錄影模式（?video=1）：固定 1280×720、無介面 ───────── */
body.video{width:1280px;height:720px;overflow:hidden;margin:0}
body.video header.top, body.video .bar, body.video .toc{display:none}
body.video .wrap{max-width:none;width:1280px;height:720px;padding:0;
  display:flex;align-items:center;justify-content:center}
body.video .stage{width:1232px;min-height:0;transform-origin:center center}
/* 預置狀態：先把舊內容無動畫地擺好，只讓這一步的新東西動 */
.prearm *, .prearm{transition:none !important; animation:none !important}
/* 錄影時版面收緊一點，讓自動縮放少縮一些、字大一些 */
body.video .stage{padding:16px 20px 18px}
body.video .chip{margin-bottom:6px}
body.video h1.t{font-size:27px;margin-bottom:2px}
body.video .t2{font-size:14.5px;margin-bottom:11px}
body.video .body{gap:18px;grid-template-columns:1fr 1fr}
body.video .body.stack{grid-template-columns:1fr}
body.video .body.stack .art{width:100%;max-width:1060px;justify-self:center}
/* stack 版面的旁白在錄影時排成兩欄：短句多的練習題頁可以少縮很多 */
body.video .body.stack ol.lines{columns:2;column-gap:18px}
body.video .body.stack ol.lines li{break-inside:avoid}
body.video ol.lines li{font-size:16.5px;padding:6px 10px 6px 34px;margin-bottom:5px}
body.video ol.lines li::before{width:20px;height:20px;top:9px;left:8px;font-size:11.5px}
body.video .eli5{margin-top:12px;padding:10px 15px;font-size:16.5px}

@media (max-width:860px){
  .wrap{padding:14px 16px 120px}
  .body{grid-template-columns:1fr}
  h1.t{font-size:24px}
  ol.lines li{font-size:16px}
  .eli5{font-size:16.5px}
  .stage{padding:16px 14px 20px;min-height:0}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="course">生物統計學　第 4 週</div>
    <div class="sub">分布與假說檢定／臨床診斷的指標　·　白話版教學動畫</div>
    <div class="spacer"></div>
    <button class="btn" id="btnVoice">🔈 配音：關</button>
    <select class="btn sel" id="selVoice" title="選語音"></select>
    <select class="btn sel" id="selRate" title="語速">
      <option value="0.8">慢</option>
      <option value="0.9">稍慢</option>
      <option value="1" selected>正常</option>
      <option value="1.1">稍快</option>
      <option value="1.25">快</option>
    </select>
    <button class="btn" id="btnToc">章節</button>
    <button class="btn" id="btnTheme">深／淺色</button>
  </header>

  <main class="stage" id="stage"></main>
</div>

<div class="bar">
  <div class="in">
    <button class="btn" id="btnPrev">◀ 上一步</button>
    <button class="btn primary" id="btnPlay">▶ 自動播放</button>
    <button class="btn" id="btnNext">下一步 ▶</button>
    <div class="prog"><i id="progBar"></i></div>
    <div class="count" id="count"></div>
  </div>
</div>

<div class="toc" id="toc">
  <div class="panel">
    <h3>章節　<span style="font-size:13px;font-weight:400;color:var(--soft)">點選跳到該段</span></h3>
    <ol id="tocList"></ol>
    <div style="margin-top:14px;text-align:right"><button class="btn" id="btnTocClose">關閉</button></div>
  </div>
</div>

<script>
/* ══════════════════ 繪圖小工具 ══════════════════ */
const SQ2PI = Math.sqrt(2*Math.PI);
const PDF = z => Math.exp(-z*z/2)/SQ2PI;
const CX = z => 400 + z*82;                     // z → svg x（viewBox 800 寬）
const CYb = 300;                                 // 基線

function nc(s=1,k=600,z0=-3.9,z1=3.9){           // 常態曲線路徑
  let d='';
  for(let i=0;i<=240;i++){
    const z=z0+(z1-z0)*i/240, y=CYb-(PDF(z/s)/s)*k;
    d += (i?'L':'M') + CX(z).toFixed(1) + ' ' + y.toFixed(1);
  }
  return d;
}
function nsh(a,b,s=1,k=600){                      // 曲線下面積
  let d='M'+CX(a).toFixed(1)+' '+CYb;
  for(let i=0;i<=90;i++){
    const z=a+(b-a)*i/90, y=CYb-(PDF(z/s)/s)*k;
    d += 'L'+CX(z).toFixed(1)+' '+y.toFixed(1);
  }
  return d + 'L'+CX(b).toFixed(1)+' '+CYb+'Z';
}
function axis(){                                  // 橫軸 + z 刻度
  let g = `<line x1="40" y1="${CYb}" x2="760" y2="${CYb}" stroke="var(--line)" stroke-width="2"/>`;
  for(let z=-3;z<=3;z++){
    g += `<line x1="${CX(z)}" y1="${CYb}" x2="${CX(z)}" y2="${CYb+6}" stroke="var(--line)" stroke-width="2"/>`;
    g += `<text class="svsm" x="${CX(z)}" y="${CYb+24}" text-anchor="middle">${z===0?'μ':(z>0?'+'+z+'σ':z+'σ')}</text>`;
  }
  return g;
}
/* 固定種子亂數，讓每次打開看到的圖一樣 */
let _sd = 20260929;
function rnd(){ _sd=(_sd*1103515245+12345)&0x7fffffff; return _sd/0x7fffffff; }
function nrnd(){ return Math.sqrt(-2*Math.log(rnd()||1e-9))*Math.cos(2*Math.PI*rnd()); }

function svg(inner,h=340){
  return `<svg viewBox="0 0 800 ${h}" role="img">${inner}</svg>`;
}
function card(x,y,w,h,fill,at,extra=''){
  return `<rect class="pop" data-at="${at}" x="${x}" y="${y}" width="${w}" height="${h}" rx="12"
           fill="${fill}" ${extra} style="transform-origin:${x+w/2}px ${y+h/2}px"/>`;
}

/* ══════════════════ 各場景的圖 ══════════════════ */

const ART = {};

ART.cover = () => svg(`
  <g data-at="1"><path class="draw" pathLength="1" d="${nc()}" fill="none" stroke="var(--ink)" stroke-width="3.5"/></g>
  <g data-at="1">${axis()}</g>
  <g data-at="2"><path d="${nsh(-1.96,1.96)}" fill="color-mix(in srgb, var(--teal) 22%, transparent)"/></g>
  <g data-at="2"><path d="${nsh(-3.9,-1.96)}" fill="color-mix(in srgb, var(--accent) 40%, transparent)"/>
                 <path d="${nsh(1.96,3.9)}" fill="color-mix(in srgb, var(--accent) 40%, transparent)"/></g>
  <g data-at="3"><text class="svbig" x="400" y="150" text-anchor="middle" fill="var(--teal)">95%</text>
                 <text class="svsm" x="400" y="172" text-anchor="middle">很常見，不懷疑</text></g>
  <g data-at="3"><text class="svsm" x="150" y="250" text-anchor="middle" fill="var(--accent)">2.5% 罕見</text>
                 <text class="svsm" x="650" y="250" text-anchor="middle" fill="var(--accent)">2.5% 罕見</text></g>
`);

ART.map = () => {
  const items = [['機率分布','有哪些？常態為什麼特別重要','var(--ink)'],
                 ['p &lt; 0.05','到底在說什麼？誰訂的','var(--accent)'],
                 ['H0 / H1','拒絕、不拒絕怎麼運作','var(--teal)'],
                 ['四個臨床指標','敏感度 特異度 PPV NPV','var(--ok)']];
  let g='';
  items.forEach((it,i)=>{
    const x=30+i*192, y=70;
    g += card(x,y,176,170,'var(--card)',i+1,`stroke="${it[2]}" stroke-width="2.5"`);
    g += `<g class="pop" data-at="${i+1}" style="transform-origin:${x+88}px ${y+85}px">
      <circle cx="${x+88}" cy="${y+42}" r="22" fill="${it[2]}"/>
      <text x="${x+88}" y="${y+50}" text-anchor="middle" font-family="var(--font)" font-size="20" font-weight="800" fill="var(--card)">${i+1}</text>
      <text class="svtxt" x="${x+88}" y="${y+98}" text-anchor="middle" font-size="18" font-weight="800">${it[0]}</text>
      <foreignObject x="${x+12}" y="${y+112}" width="152" height="54">
        <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:var(--font);font-size:13.5px;line-height:1.45;color:var(--soft);text-align:center">${it[1]}</div>
      </foreignObject></g>`;
  });
  g += `<g data-at="5"><text class="svsm" x="400" y="286" text-anchor="middle">前半段學「怎麼算機率」　·　後半段學「怎麼讀一張檢驗報告」</text></g>`;
  return svg(g,310);
};

ART.whatIsDist = () => {
  _sd = 4533;                     // 固定種子：每次打開都一樣
  // 100 顆球落成直方圖
  const bins=new Array(13).fill(0), pos=[];
  for(let i=0;i<100;i++){
    let b=Math.round(nrnd()*2.4)+6; b=Math.max(0,Math.min(12,b));
    pos.push([b,bins[b]]); bins[b]++;
  }
  const bw=46, x0=400-6.5*bw, dy=11;
  let g = `<line x1="40" y1="${CYb}" x2="760" y2="${CYb}" stroke="var(--line)" stroke-width="2"/>`;
  g += `<g data-at="1">`;
  pos.forEach(([b,k],i)=>{
    const cx=x0+b*bw+bw/2, cy=CYb-6-k*dy;
    g += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="4.6"
            fill="${Math.abs(b-6)<=2?'var(--teal)':'var(--soft)'}" opacity=".85"/>`;
  });
  g += `</g>`;
  g += `<g data-at="2">`;
  bins.forEach((n,b)=>{ const h=n*dy+6;
    g += `<rect x="${(x0+b*bw+5).toFixed(1)}" y="${(CYb-h).toFixed(1)}" width="${bw-10}" height="${h.toFixed(1)}"
            rx="3" fill="color-mix(in srgb, var(--ink) 16%, transparent)"/>`; });
  g += `</g>`;
  // 疊上與資料相合的曲線（bin 單位的 sd = 2.4）
  let d='';
  for(let i=0;i<=200;i++){
    const b=-6.5+13*i/200, y=CYb-6-(PDF(b/2.4)/2.4)*100*dy;
    d += (i?'L':'M')+(400+b*bw).toFixed(1)+' '+y.toFixed(1);
  }
  g += `<g data-at="3"><path class="draw" pathLength="1" d="${d}" fill="none" stroke="var(--accent)" stroke-width="3.5"/></g>`;
  g += `<g data-at="1"><text class="svsm" x="400" y="${CYb+26}" text-anchor="middle">矮　←　身高　→　高</text></g>`;
  g += `<g data-at="2"><text class="svsm" x="620" y="110" text-anchor="middle">柱子高 = 這個數值的人多</text></g>`;
  g += `<g data-at="3"><text class="svtxt" x="620" y="80" text-anchor="middle" fill="var(--accent)" font-weight="800">一座山</text></g>`;
  return svg(g,345);
};

ART.contDisc = () => {
  let g = `<g data-at="1">
    <text class="svtxt" x="210" y="34" text-anchor="middle" font-weight="800">連續型</text>
    <text class="svsm" x="210" y="54" text-anchor="middle">可以有小數，像水龍頭的水</text>
    <line x1="40" y1="250" x2="380" y2="250" stroke="var(--line)" stroke-width="2"/></g>`;
  let d='';
  for(let i=0;i<=160;i++){ const z=-3+6*i/160; d+=(i?'L':'M')+(210+z*52).toFixed(1)+' '+(250-PDF(z)*420).toFixed(1); }
  g += `<g data-at="1"><path class="draw" pathLength="1" d="${d}" fill="none" stroke="var(--ink)" stroke-width="3.2"/></g>`;
  g += `<g data-at="2"><text class="svsm" x="210" y="280" text-anchor="middle">身高、體重、血壓、血糖</text>
                        <text class="svsm" x="210" y="302" text-anchor="middle" fill="var(--teal)">常態、t、卡方、F</text></g>`;

  g += `<line x1="400" y1="20" x2="400" y2="310" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="5 5"/>`;

  g += `<g data-at="3">
    <text class="svtxt" x="590" y="34" text-anchor="middle" font-weight="800">離散型</text>
    <text class="svsm" x="590" y="54" text-anchor="middle">一個一個數，像糖果</text>
    <line x1="430" y1="250" x2="760" y2="250" stroke="var(--line)" stroke-width="2"/></g>`;
  const hs=[26,62,100,118,96,58,28,12];
  g += `<g data-at="3">`;
  hs.forEach((h,i)=>{ g += `<rect class="grow" data-at="3" x="${455+i*38}" y="${250-h}" width="28" height="${h}" rx="3"
      fill="var(--teal)" opacity=".8" style="transform-origin:${455+i*38}px 250px"/>`; });
  g += `</g>`;
  g += `<g data-at="4"><text class="svsm" x="590" y="280" text-anchor="middle">一週跌倒 0、1、2、3 次（沒有 1.5 次）</text>
                        <text class="svsm" x="590" y="302" text-anchor="middle" fill="var(--teal)">白努利、二項、卜瓦松……</text></g>`;
  return svg(g,320);
};

ART.twoNumbers = () => {
  let g = axis();
  g += `<g data-at="1"><path class="draw" pathLength="1" d="${nc(1,420)}" fill="none" stroke="var(--ink)" stroke-width="3.5"/>
    <line x1="${CX(0)}" y1="${CYb}" x2="${CX(0)}" y2="${(CYb-PDF(0)*420).toFixed(1)}" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="6 5"/>

  mid += 'L'+X(16.7+10).toFixed(1)+' '+CYb+'Z';

  g += `<g class="pop" data-at="2" style="transform-origin:${X(12)}px ${CYb-14}px">

  g += `<g data-at="3"><path d="${tail}" fill="color-mix(in srgb, var(--warn) 45%, transparent)"/></g>`;

ART.tails = () => {
  const k=380;
  let g = `<g data-at="1"><text class="svtxt" x="210" y="26" text-anchor="middle" font-weight="800">雙尾檢定</text>
    <text class="svsm" x="210" y="46" text-anchor="middle">H1：μ ≠ 227（大小都算有差）</text></g>`;
  const mini=(ox,at,cuts,crit,lab)=>{
    const X=z=>ox+z*44, Y=p=>250-p*k;
    let d=''; for(let i=0;i<=180;i++){const z=-3.6+7.2*i/180; d+=(i?'L':'M')+X(z).toFixed(1)+' '+Y(PDF(z)).toFixed(1);}
    let sh='';
    cuts.forEach(([a,b])=>{ let q='M'+X(a).toFixed(1)+' 250';
      for(let i=0;i<=50;i++){const z=a+(b-a)*i/50; q+='L'+X(z).toFixed(1)+' '+Y(PDF(z)).toFixed(1);}
      sh += `<path d="${q}L${X(b).toFixed(1)} 250Z" fill="color-mix(in srgb, var(--accent) 45%, transparent)"/>`; });
    let out = `<g data-at="${at}">${sh}<path class="draw" pathLength="1" d="${d}" fill="none" stroke="var(--ink)" stroke-width="3.2"/>
      <line x1="${ox-170}" y1="250" x2="${ox+170}" y2="250" stroke="var(--line)" stroke-width="2"/>`;
    crit.forEach(c=>{ out += `<line x1="${X(c)}" y1="250" x2="${X(c)}" y2="${Y(PDF(c))-16}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 4"/>
      <text class="svsm" x="${X(c)}" y="${Y(PDF(c))-22}" text-anchor="middle" fill="var(--accent)" font-weight="700">${c>0?'+':''}${c}</text>`; });
    out += `<text class="svtxt" x="${ox}" y="282" text-anchor="middle" font-size="15.5">${lab}</text></g>`;
    return out;
  };
  g += mini(210,1,[[-3.6,-1.96],[1.96,3.6]],[-1.96,1.96],'各切 2.5%　臨界值 ±1.96');
  g += `<line x1="400" y1="16" x2="400" y2="300" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="5 5"/>`;
  g += `<g data-at="2"><text class="svtxt" x="590" y="26" text-anchor="middle" font-weight="800">單尾檢定</text>
    <text class="svsm" x="590" y="46" text-anchor="middle">H1：μ &gt; 227（只算一個方向）</text></g>`;
  g += mini(590,2,[[1.645,3.6]],[1.645],'一邊切 5%　臨界值 1.645');

ART.ci = () => {
  const trueX = 420, sc = 46;
  let g = `<g data-at="1"><line x1="${trueX}" y1="24" x2="${trueX}" y2="306" stroke="var(--accent)" stroke-width="3"/>

  _sd = 123;
  const se = 0.62;                       // 標準誤（示意）
  for(let i=0;i<20;i++){
    const m = nrnd()*se, half = 1.96*se;
    const miss = Math.abs(m) > half;
    const y = 36 + i*13.4, x1 = trueX + (m-half)*sc, x2 = trueX + (m+half)*sc;
    const col = miss ? 'var(--warn)' : 'var(--teal)';
    g += `<g data-at="${i<10?2:3}">
      <line x1="${x1.toFixed(1)}" y1="${y}" x2="${x2.toFixed(1)}" y2="${y}" stroke="${col}" stroke-width="3.4"/>

      <line x1="${x2.toFixed(1)}" y1="${y-4}" x2="${x2.toFixed(1)}" y2="${y+4}" stroke="${col}" stroke-width="3"/>
      <circle cx="${(trueX+m*sc).toFixed(1)}" cy="${y}" r="3.4" fill="${col}"/></g>`;
  }
  g += `<g data-at="4"><text class="svsm" x="650" y="130" fill="var(--teal)">大多數的區間蓋住了 μ</text>
    <text class="svsm" x="650" y="152" fill="var(--warn)">少數幾條沒蓋到（約 5%）</text>
    <text class="svtxt" x="650" y="190" font-weight="800">會動的是「區間」</text>

};

function glossArt(items, cols) {

      <text class="svsm" x="${x + w / 2}" y="${y + 72}" text-anchor="middle" font-size="16">${it[1]}</text></g>`;
  });
  return g;
}

         [2,'<b>σ（標準差）</b>決定這座山有多胖。σ 小 → 又高又瘦，大家都很接近。'],
         [3,'σ 大 → 又矮又胖，每個人差很多。'],
         [4,'知道 μ 和 σ，整條曲線就<span class="hi">固定</span>了。曲線固定 → 任何範圍的機率都算得出來。'],
         [5,'補充：常態分布左右完全對稱，平均數在正中間，所以「大於 μ」和「小於 μ」的機率都是 50%；而且三個中心指標重合：平均數 = 中位數 = 眾數。'],
         [5,'但實務資料很難完美常態，平均數和中位數通常不會剛好一樣 —— 要靠<span class="hi">偏態與峰度</span>判斷偏離多嚴重。']],
  eli5:'常態分布只要問兩件事：中心在哪、散得多開。' },

{ ch:'常態分布', t:'68 - 95 - 99.7 法則', t2:'整學期最該背的三個數字',
  art:ART.rule689599, layout:'side',
  lines:[[1,'離平均 <b>1 個標準差</b>以內 → 約 <span class="hi">68%</span> 的人。'],
         [2,'<b>2 個標準差</b>以內 → 約 <span class="hi">95%</span>。'],
         [3,'<b>3 個標準差</b>以內 → 約 <span class="hi">99.7%</span>。'],
         [4,'反過來看：離平均超過 2 個標準差的人，<b>不到 5%</b> —— 這就是後面 0.05 的來源。']],
  eli5:'68、95、99.7。背起來，後面整學期都在用。' },

{ ch:'常態分布', t:'為什麼「面積」就是「機率」', t2:'考試不會叫你積分，但這個觀念不能缺',
  art:ART.areaProb, layout:'side',
  lines:[[1,'常態分布曲線的正式名稱叫<b>機率密度圖</b>。'],
         [2,'曲線下方的<span class="hi">總面積 = 1</span>，也就是 100%。'],
         [3,'某一段範圍下的面積 = 落在那段範圍的<b>機率</b>。例：-1σ 到 0 之間的面積是 0.341 → 有 <span class="hi">34.1%</span> 的機率落在這個範圍。'],
         [4,'概念上怎麼算：<b>分子</b>＝把 -1σ 到 0 之間所有 y 值加起來；<b>分母</b>＝把整條曲線所有 y 值加起來；分子 ÷ 分母 = 34.1%。'],
         [5,'丟 100 個人進去，大約 68 個落在 ±1σ 這塊藍色區域裡 —— 面積 68%，機率 68%。'],
         [6,'數學上這叫「對機率密度函數積分」，但你不用會算 —— 考試不會叫你積分，你只要知道<b>面積 = 機率</b>。']],
  eli5:'面積 = 機率。那塊有多大，機率就是多少。' },

{ ch:'標準化', t:'Z 分數：把所有的尺統一', t2:'一個很實務的問題，和它的解法',
  art:ART.zscore, layout:'side',
  lines:[[1,'男生身高 μ=148、σ=2.5；女生 μ=152、σ=3.5；血壓、血糖、成績每組都不一樣。'],
         [1,'難道每一組都要重畫一條曲線、重算一次面積？查不完。'],
         [2,'解法：先<b>標準化</b> —— 把原始值換算成「離平均數幾個標準差」。公式是 <span class="hi">Z = (x - μ) / σ</span>。'],
         [3,'換算完，<b>任何</b>一組資料都會變成 μ=0、σ=1 的同一條曲線 → 一張 Z 表通吃。'],
         [4,'例：146 公分的男生 → Z = (146 - 148) / 2.5 = <b>-0.8</b>，意思是「比平均矮 0.8 個標準差」。']],
  eli5:'不管原本量公分還是量血壓，先換成「離平均幾步」，就能互相比較。' },

{ ch:'標準化', t:'Z 分數怎麼讀', t2:'這幾個數字整學期都會再看到',
  art:ART.zread, layout:'side',
  lines:[[1,'<b>Z = 0</b>：剛好等於平均數。'],
         [2,'<b>Z = +1</b>：比平均高 1 個標準差 —— 約 84% 的人比他低。'],
         [3,'<b>Z = -2</b>：比平均低 2 個標準差 —— 只有約 2.3% 的人比他更低。'],
         [4,'<b>Z = ±1.96</b>：雙尾 5% 的臨界值。<span class="hi">這個數字今天之後會出現一百次。</span>'],
         [5,'<b>Z = ±2.58</b>：雙尾 1% 的臨界值。'],
         [6,'查表步驟永遠是：① 換成 Z　② 畫草圖把要的區域塗黑　③ 查表　④ 加減（同號相減、異號相加）。']],
  eli5:'Z 的單位是「幾個標準差」，跟公分、mmHg 無關。' },

{ ch:'標準化', t:'練習：用 Z 表算面積', t2:'Z 表給的通常是「0 到 Z」之間的面積 —— 先看清楚表格的定義再查',
  art:ART.zpractice, layout:'stack',
  lines:[[1,'題目：查表求以下 Z 值範圍所對應的面積（機率）。(1) 0 ≦ Z ≦ 1.76：直接查表 → <b>0.4608</b>。'],
         [2,'(2) Z ≧ 1.76：右半邊一共 0.5，扣掉剛剛那塊 → 0.5 - 0.4608 = <b>0.0392</b>。'],
         [3,'(3) 0.56 ≦ Z ≦ 1.77：兩個都在右邊 → 大的減小的 → 0.4616 - 0.2123 = <b>0.2493</b>。'],
         [4,'(4) -2.05 ≦ Z ≦ 0：左右對稱，跟 0 到 2.05 一樣 → <b>0.4798</b>。'],
         [5,'(5) -0.93 ≦ Z ≦ +0.55：一左一右 → 兩塊相加 → 0.3238 + 0.2088 = <b>0.5326</b>。'],
         [6,'(6) -1.14 ≦ Z ≦ -0.38：都在左邊 → 相減 → 0.3729 - 0.1480 = <b>0.2249</b>。'],
         [7,'訣竅：先畫一張草圖，把要求的區域塗黑，就不會加錯減錯。口訣是<span class="hi">同號相減、異號相加</span>。']],
  eli5:'先畫圖、再查表，加減就不會錯。' },

{ ch:'標準化', t:'練習：把原始值換成 Z 再查表', t2:'全國 12 歲兒童身高　男生 μ = 148、σ = 2.5；女生 μ = 152、σ = 3.5',
  art:ART.rawz, layout:'stack',
  lines:[[1,'(1) 多少比例的<b>男生</b>身高介於 146 至 151 公分？'],
         [2,'① 先換成 Z：Z1 = (146 - 148)/2.5 = -0.8；Z2 = (151 - 148)/2.5 = +1.2。'],
         [3,'② 畫草圖：一左一右，兩塊相加。③ 查表：P(-0.8 ≦ Z ≦ 1.2) = 0.2881 + 0.3849 = 0.6730 → <b>67.30%</b>。'],
         [4,'(2) 多少比例的<b>女生</b>身高介於 149 至 157 公分？'],
         [5,'先換成 Z：Z1 = (149 - 152)/3.5 = -0.86；Z2 = (157 - 152)/3.5 = +1.43。'],
         [6,'查表相加：P(-0.86 ≦ Z ≦ 1.43) = 0.3051 + 0.4236 = 0.7287 → <b>72.87%</b>。步驟永遠是：① 換成 Z ② 畫草圖 ③ 查表 ④ 加減。']],
  eli5:'原始值不能直接查表，一定要先換成 Z。' },

{ ch:'假設檢定', t:'先看問題卡在哪裡', t2:'為什麼不能直接猜母體',
  art:ART.bag, layout:'side',
  lines:[[1,'前面講的都有個前提：我們<b>知道</b>母體的 μ 和 σ。但現實中我們完全不知道。'],
         [2,'從袋子裡抽 4 顆球，算出平均是 1 分。那整袋球的平均是多少？'],
         [3,'可能袋子裡就只有那 4 顆 1 分球，剛好全抽到。'],
         [4,'也可能 20 顆裡有 6 顆 1 分 —— 運氣普通。'],
         [5,'也可能 100 顆裡只有 4 顆 1 分 —— 運氣很好，但機率<b>不等於 0</b>。'],
         [6,'結論：光靠一次抽樣要「猜出」母體，有無限種可能，<span class="hi">估不出來</span>。']],
  eli5:'直接猜母體是死路 —— 所以統計學走了一條完全相反的路。' },

{ ch:'假設檢定', t:'那就反過來問：骰子作弊了嗎', t2:'整門課最核心的一招',
  art:ART.dice, layout:'side',
  lines:[[1,'不去猜母體，改成反過來問。① <b>先假設一個母體</b>：假設骰子公正，擲出六點的機率 = 1/6 ≒ 16.7%。② 根據這個假設畫出抽樣分布：中心放在假設值，寬度由標準誤決定。'],
         [2,'③ 看實際觀察到的結果落在哪裡。某甲擲 25 次得 3 次六點 = 12% → 落在山的中間，<span class="hi">很常見</span>，沒理由懷疑一開始的假設。'],
         [3,'某乙擲 31 次得 22 次六點 = 71% → 落在山腳下，<b>太罕見了</b>。有人作弊，你覺得是誰？大家都會說某乙 —— 因為 71% 比 16.7% 高得太離譜，一顆公正的骰子很難擲出這種結果。'],
         [4,'落在極端有兩種可能：一、我運氣太好或太差，剛好抽到很難見到的結果；二、一開始的假設（骰子公正）就是錯的。'],
         [5,'<b>統計學選擇相信第二種。</b> 這就叫「否證邏輯」—— 你早就會用了，統計只是把它寫成公式。'],
         [6,'用<span class="hi">統計語言</span>說：理論上若母體平均為 μ，單次抽樣得到樣本平均 x 的機率極小時，就會認為母體平均可能不是 μ —— 某乙的骰子可能不是公正的。']],
  eli5:'不去猜答案，先假設一個答案，再看資料打不打得到它。' },

{ ch:'假設檢定', t:'否證邏輯：科學為什麼不「證明」', t2:'統計永遠不會「證明」任何事，它只會說「這個假設不太可能對」',
  art:ART.falsify, layout:'side',
  lines:[[1,'我們<b>不是</b>去證明「某乙的骰子擲出六點的機率是 71%」。'],
         [2,'而是去<b>否定</b>「某乙的骰子擲出六點的機率是 16.7%」。'],
         [3,'為什麼要繞這一圈？因為母體的真值<span class="hi">只有上帝知道</span> —— 我們永遠沒辦法直接證明它。'],
         [4,'但我們可以一個一個否定掉不可能的答案，<b>逐步逼近</b>真值。'],
         [5,'這在科學哲學上稱為<span class="hi">否證邏輯</span>，也叫<span class="hi">證偽法</span>。'],
         [6,'所以統計結論的正確寫法是 ○「拒絕虛無假設」「兩組有顯著差異」；錯誤寫法是 ×「證明了新藥有效」「兩組完全一樣」。']],
  eli5:'我們證明不了真值是多少，只能把「不可能的答案」一個一個劃掉。' },

{ ch:'假設檢定', t:'H0 與 H1：靶和箭', t2:'這一頁的用詞，之後每一種方法都會用到',
  art:ART.target, layout:'side',
  lines:[[1,'<b>虛無假設 H0</b>：我們先假設的「沒事發生」狀態，它是<span class="hi">被拿來打的靶</span>。例：某乙的骰子擲出六點的機率 = 16.7%。'],
         [1,'<b>對立假設 H1</b>：跟 H0 互斥，通常就是我們真正想證明的。例：機率 ≠ 16.7%。H0 永遠寫「沒有差異、沒有關聯、等於某個值」。'],
         [2,'打中了 → <b>拒絕 H0</b> → 支持 H1 → 這叫「達到顯著差異」。'],
         [3,'沒打中 → <b>不拒絕 H0</b> → 這次的資料不足以推翻它。'],
         [4,'<b>注意：不拒絕 ≠ 接受。</b>「查無證據」不等於「證明無罪」—— 只是這次的資料不足以推翻 H0，不等於 H0 是對的。']],
  eli5:'H0 是靶，不是結論。打不中只代表箭不夠力，不代表靶是對的。' },

{ ch:'p 值', t:'Magic Number 0.05', t2:'「機率很小」—— 小到多少才算小？',
  art:ART.pvalue, layout:'side',
  lines:[[1,'前面一直說「這個機率很小」，但小很主觀。有人覺得 20% 就小了。科學研究不能這麼模糊。'],
         [2,'所以科學界訂了一個公認門檻：<b>0.05</b>。雙尾的話兩邊各切 2.5%，這兩塊叫<span class="hi">拒絕區</span>。'],
         [3,'切點（臨界值）就是剛才那個 <b>±1.96</b>。'],
         [4,'<b>p 值</b> = 如果 H0 是真的，出現目前這種（或更極端）結果的機率。落在橘色區 → p &lt; 0.05 → 拒絕 H0。'],
         [5,'0.05 這個門檻有個名字：<span class="hi">顯著水準 α</span>。要在收資料<b>之前</b>就決定。']],
  eli5:'p 值小 = 「如果 H0 是真的，這結果太巧了」。' },

{ ch:'p 值', t:'p 值最常被講錯的兩句話', t2:'全班最常錯的一題，期中考一定會考',
  art:ART.pwrong, layout:'stack',
  lines:[[1,'先把對的那一句記熟：那個 3% 是<b>在「H0 為真」這個前提下</b>算出來的機率。'],
         [2,'第一個錯，是把前提和結論<b>對調</b>了 —— 「H0 為真的機率是 3%」聽起來很像，但完全是另一件事。'],
         [3,'第二個錯，是把 p 當成「差多少」。收的人夠多，<span class="hi">很小的差異也會算出很小的 p</span>。差多少要看效果量。']],
  eli5:'p 只回答「巧不巧」，不回答「差多少」。' },

{ ch:'p 值', t:'0.05 是誰訂的？費雪與奶茶', t2:'一個 1920 年代的下午茶',
  art:ART.tea, layout:'side',
  lines:[[1,'1920 年代，英國統計學家 Ronald Fisher 在劍橋的一場下午茶：一位女士宣稱，她喝得出來奶茶是<b>先加茶</b>還是<b>先加奶</b>。'],
         [2,'Fisher 設計了實驗：8 杯，4 杯先加奶、4 杯先加茶，隨機排列，請她挑出哪 4 杯是先加奶的。'],
         [3,'如果她是亂猜的，全部猜對的機率 = 1 / C(8,4) = <span class="hi">1/70 ≒ 1.4%</span>。'],
         [4,'1.4% 太小了 → 如果她真的全對，就有理由相信她<b>不是亂猜</b>的。（歷史記載：她全部答對了。）'],
         [4,'Fisher 後來在著作中把 0.05 當成慣用判斷標準，一路沿用至今。'],
         [4,'所以 0.05 <b>不是絕對標準</b> —— 這是人為訂定的，可以視情況調整，不同學門的慣例也不一樣：醫學、護理、社會科學以 0.05 為主流；基因體研究一次檢定幾萬個基因，常用 5×10^-8；物理學發現新粒子要求 5 sigma（約 3×10^-7）；探索性的前導研究有時放寬到 0.10。'],
         [4,'重點是<span class="hi">事先講好</span> —— 算完之後再改門檻來讓結果變顯著，在研究倫理上不被接受。']],
  eli5:'0.05 不是天啟，是一位統計學家的方便選擇，後來變成大家的默契。' },

{ ch:'單尾雙尾', t:'單尾 vs 雙尾', t2:'對立假設怎麼寫，決定你要切幾邊',
  art:ART.tails, layout:'side',
  lines:[[1,'<b>雙尾</b>：H1 寫「不等於」（μ ≠ 227）—— 不管比較大還是比較小都算有差。α = 0.05 平分兩邊，各 2.5%，臨界值 <span class="hi">±1.96</span>。'],
         [2,'<b>單尾</b>：H1 寫「大於」或「小於」（μ &gt; 227）—— 只有一個方向算。5% 全放一邊，臨界值變成 <span class="hi">1.645</span>。'],
         [3,'1.645 比 1.96 小 → <b>單尾比較容易達到顯著</b>，所以它的使用受到嚴格限制。'],
         [3,'可以用單尾的情況：理論上完全排除另一個方向（例如檢驗新藥「是否比安慰劑好」—— 沒有人會期待新藥比安慰劑差），<b>而且必須在收資料前就決定</b>。'],
         [3,'不可以的情況：算完發現雙尾不顯著就改單尾 —— 這是研究不端行為（p-hacking）。'],
         [3,'期刊審查最常抓的問題之一，就是「<b>為什麼你用單尾？</b>」'],
         [3,'實務建議：護理與醫學研究<span class="hi">絕大多數用雙尾</span>，不確定就用雙尾，比較保守也比較安全。這門課的作業與考試一律用雙尾。']],
  eli5:'單尾比較好過關，所以規定比較嚴。不確定就用雙尾。' },

{ ch:'信賴區間', t:'信賴區間：比 p 值更有話講', t2:'p 值只說顯不顯著，CI 說真值大概在哪',
  art:ART.ci, layout:'side',
  lines:[[1,'每做一次研究，就會算出一個 <b>95% CI</b> = 樣本平均數 ± 1.96 × 標準誤：中心點是我們算出來的估計值，往左右各延伸 1.96 個標準誤（母體標準差未知時要改用 <span class="hi">t 分布</span>的臨界值，W07 會講）。'],
         [2,'假設我們重複做很多次研究 —— 每一條橫線就是一次研究算出來的區間。'],
         [3,'大多數區間蓋住了真正的 μ（藍色），少數幾條沒蓋到（紅色）。'],
         [4,'<b>「95%」的意思就是這個</b>：用這種方法重複做很多次研究，約 95% 的區間會蓋住真正的 μ。例如「95% CI 為 [118, 126]」就要這樣解讀。'],
         [5,'<b>× 常見錯誤：</b>「真值有 95% 機率落在這個區間裡」。錯 —— 真值是固定的，它要嘛在區間裡、要嘛不在，沒有機率可言；有隨機性的是<span class="hi">區間</span>，不是真值。這是統計最常被誤解的概念之一，期中考會考。'],

/* ══════════════════ 播放引擎 ══════════════════ */
const stage = document.getElementById('stage');
let si = 0, step = 0, playing = false, timer = null;

const maxStep = s => s.lines.reduce((m,l)=>Math.max(m,l[0]), 1);
const totalSteps = SCENES.reduce((a,s)=>a+maxStep(s),0);

function render(){
  const s = SCENES[si];
  const artHTML = s.art ? s.art() : '';
  stage.innerHTML = `
    <div class="chip">${s.ch}　·　場景 ${si+1} / ${SCENES.length}</div>
    <h1 class="t">${s.t}</h1>
    <p class="t2">${s.t2||''}</p>
    <div class="body ${s.layout==='stack'?'stack':''}">
      <div class="art">${artHTML}</div>
      <div>
        <ol class="lines">${s.lines.map((l,i)=>`<li data-step="${l[0]}">${l[1]}</li>`).join('')}</ol>
        <div class="eli5"><span>一句話版</span>${s.eli5}</div>
      </div>
    </div>`;
  paint();
  buildToc();
}

const VIDEO = /(?:\?|&)video=1/.test(location.search);

function applyOn(upto, cur){
  stage.querySelectorAll('[data-at]').forEach(el=>{
    const until = el.dataset.until ? +el.dataset.until : Infinity;
    el.classList.toggle('on', +el.dataset.at <= upto && cur <= until);
  });
  stage.querySelectorAll('[data-only]').forEach(el=>{
    el.classList.toggle('on', +el.dataset.only === cur);
  });
  stage.querySelectorAll('ol.lines li').forEach(li=>{
    const n = +li.dataset.step;
    li.classList.toggle('on', n <= upto);
    li.classList.toggle('cur', n === cur);
  });
}

function fitVideo(){
  if(!VIDEO) return;
  stage.style.transform = 'none';
  const sc = Math.min(1, 700 / stage.offsetHeight);
  stage.style.transform = 'scale(' + sc.toFixed(4) + ')';
}

function paint(){
  const s = SCENES[si], m = maxStep(s);
  if(VIDEO){
    // 第一段：把前面幾步無動畫地擺上去（否則錄影時整頁會一起重新淡入）
    stage.classList.add('prearm');
    applyOn(step-1, step);
    stage.querySelector('.eli5').classList.toggle('on', step-1 >= m);
    void stage.offsetHeight;              // 強制 reflow，讓上面的狀態定住
    stage.classList.remove('prearm');
  }
  applyOn(step, step);
  stage.querySelector('.eli5').classList.toggle('on', step >= m);
  fitVideo();
  // 行數多的場景會超出一個螢幕：把剛點亮的那一行捲進可視範圍
  const cur = VIDEO ? null : (stage.querySelector('ol.lines li.cur') ||
              (step >= m ? stage.querySelector('.eli5') : null));
  if(cur){
    const r = cur.getBoundingClientRect();
    if(r.bottom > window.innerHeight - 70 || r.top < 60)
      cur.scrollIntoView({block:'center', behavior:'smooth'});
  }
  // 進度
  let done = 0;
  for(let i=0;i<si;i++) done += maxStep(SCENES[i]);
  done += step;
  document.getElementById('progBar').style.width = (done/totalSteps*100).toFixed(1)+'%';
  document.getElementById('count').textContent = `場景 ${si+1}/${SCENES.length}　步驟 ${step}/${m}`;
  document.querySelectorAll('#tocList button').forEach((b,i)=>b.classList.toggle('now', i===si));
}

function go(d){
  const m = maxStep(SCENES[si]);
  if(d>0){
    if(step < m){ step++; }
    else if(si < SCENES.length-1){ si++; step = 1; render(); setHash(); return; }
    else { stop(); return; }
  }else{
    if(step > 1){ step--; }
    else if(si > 0){ si--; step = maxStep(SCENES[si]); render(); setHash(); return; }
  }
  paint();
}

function jump(i, st){ si = i; step = st || 1; render(); setHash(); }
function setHash(){
  try{ history.replaceState(null,'','#'+(si+1)); }catch(e){}
}
function readHash(){
  const h = (location.hash||'').replace('#','');
  if(!h) return false;
  const [a,b] = h.split('.');
  const i = parseInt(a,10)-1;
  if(isNaN(i) || i<0 || i>=SCENES.length) return false;
  si = i;
  const m = maxStep(SCENES[si]);
  step = b==='end' ? m : Math.min(m, Math.max(1, parseInt(b,10)||1));
  return true;
}

function dwell(){
  const s = SCENES[si];
  const txt = s.lines.filter(l=>l[0]===step).map(l=>l[1].replace(/<[^>]+>/g,'')).join('');
  const base = (step===maxStep(s)) ? 2600 : 1400;   // 最後一步多停一下看「一句話版」
  return Math.min(13000, base + txt.length*118);
}
function tick(){
  clearTimeout(timer);
  if(!playing) return;
  const atEnd = () => si===SCENES.length-1 && step===maxStep(SCENES[si]);
  if(voiceOn && TTS && theVoice){
    speakStep(()=>{
      if(!playing) return;
      if(atEnd()){ stop(); return; }
      timer = setTimeout(()=>{ go(1); tick(); }, 650);   // 唸完停半拍再前進
    });
    return;
  }
  timer = setTimeout(()=>{
    if(si===SCENES.length-1 && step===maxStep(SCENES[si])){ stop(); return; }
    go(1); tick();
  }, dwell());
}
function play(){ playing=true; document.getElementById('btnPlay').textContent='⏸ 暫停'; tick(); }
function stop(){ playing=false; clearTimeout(timer); if(typeof stopSpeak==='function') stopSpeak(); document.getElementById('btnPlay').textContent='▶ 自動播放'; }

function buildToc(){
  const list = document.getElementById('tocList');
  if(list.children.length) {
    document.querySelectorAll('#tocList button').forEach((b,i)=>b.classList.toggle('now', i===si));
    return;
  }
  list.innerHTML = SCENES.map((s,i)=>
    `<li><button data-i="${i}">${s.t}<span class="k">${s.ch}</span></button></li>`).join('');
  list.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
    manualJump(+b.dataset.i); document.getElementById('toc').classList.remove('open');
  }));
}

/* ══════════════════ 配音 ══════════════════
   兩種聲音來源，自動挑：
   1. 預錄音檔（anim_audio/）：事先用 Edge 的曉臻自然語音錄好，離線可用，每台電腦聲音都一樣。
      由 deck-scripts/anim/make_audio.py 產生。
   2. 瀏覽器內建語音合成：沒有預錄音檔、或那一步的旁白改過（文字對不上音檔）時自動退回。 */

const TTS = ('speechSynthesis' in window);
const REC = (window.AUDIO_MANIFEST && window.AUDIO_MANIFEST.steps) ? window.AUDIO_MANIFEST : null;
const REC_LABEL = '曉臻（預錄，離線可用）・台灣';
let voiceOn = false, voices = [], theVoice = null, speakSeq = 0;
let rate = 1, audioEl = null;

/* @@NARRATION-BEGIN@@ ── 旁白文字：瀏覽器朗讀和預錄音檔共用這一段，make_audio.py 也會讀 ── */
/* 符號要先換成唸得出來的中文，否則會念成亂七八糟的東西 */
const SAY = [
  // 先處理「符號 + 中文說明」並列的寫法，避免唸成「母體平均數 母體平均數」
  [/μ\s*（平均數）/g, '平均數'], [/σ\s*（標準差）/g, '標準差'],
  [/母體平均數\s*μ/g, '母體平均數'],
  [/σ\s*\/\s*√n/g, '母體標準差除以根號 n'],
  [/\[\s*([\d.]+)\s*,\s*([\d.]+)\s*\]/g, '$1 到 $2'],
  [/(\d),(\d{3})/g, '$1$2'],
  [/(\d)\s*:\s*(\d)/g, '$1 比 $2'],
  [/\s+:\s+/g, ' 比 '],
  [/\((\d)\)/g, '第$1題，'],
  [/→/g, '，'],
  [/(\d)\s*×\s*10\^-(\d+)/g, '$1乘以10的負$2次方'],
  [/(\d)\s*×\s*(\d)/g, '$1乘$2'],
  [/(\d)\s+-\s+(\d)/g, '$1減$2'],
  [/([A-Za-z])\s+-\s+/g, '$1 減 '],
  [/(^|[^\w])-(\d)/g, '$1負$2'],
  [/√/g, '根號'], [/÷/g, '除以'], [/=/g, '等於'],
  [/C\((\d+)\s*,\s*(\d+)\)/g, 'C $1 取 $2'],
  [/○/g, '正確，'], [/×/g, '錯誤，'],
  [/H0/g, 'H零'], [/H1/g, 'H一'],
  [/μ/g, '母體平均數'], [/σ/g, '標準差'], [/α/g, '顯著水準'],
  [/≒/g, '約等於'], [/≧/g, '大於等於'], [/≦/g, '小於等於'], [/≠/g, '不等於'],
  [/</g, '小於'], [/>/g, '大於'], [/±/g, '正負'],
  [/[＋+]/g, '加'],
  [/／/g, '、'], [/\//g, '除以'],
  [/①/g, '第一，'], [/②/g, '第二，'], [/③/g, '第三，'],
  [/④/g, '第四，'], [/⑤/g, '第五，'], [/⑥/g, '第六，'],
  [/[～~]/g, '到'],
  [/——+/g, '，'], [/—/g, '，'], [/·/g, '，'],
  [/[（(]/g, '，'], [/[）)]/g, '，'],
  [/[「」『』]/g, ''],
  [/\s*，[\s，]*/g, '，'],
  [/^，|，(?=[。？！；：])/g, ''],
  [/\s+/g, ' '],
];

function decodeEnt(t) {
  return String(t).replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"')
                  .replace(/&#39;/g, "'").replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&');
}
function spoken(html) {
  let t = decodeEnt(String(html).replace(/<[^>]+>/g, ' '));
  for (const [re, rep] of SAY) t = t.replace(re, rep);
  return t.trim();
}
/* 切成短句，避免 Chrome 唸超過 15 秒會自己斷掉的老問題 */
function sentences(t) {
  return t.replace(/([。！？；])/g, '$1\u0001').split('\u0001')
          .map(x => x.trim()).filter(Boolean);
}
/* 第 sIdx 個場景、第 k 步要唸的句子：新場景先報標題，最後一步加「一句話版」 */
function stepParts(sIdx, k) {
  const s = SCENES[sIdx], m = maxStep(s), parts = [];
  if (k === 1) parts.push(spoken(s.t));
  s.lines.filter(l => l[0] === k).forEach(l => parts.push(...sentences(spoken(l[1]))));
  if (k === m) parts.push(...sentences(spoken(s.eli5)));
  return parts;
}
/* 錄音用的整段文字；也拿來比對音檔是不是跟目前的旁白一致 */
function stepText(sIdx, k) {
  return stepParts(sIdx, k).map(p => /[。！？；：]$/.test(p) ? p : p + '。').join('');
}
/* @@NARRATION-END@@ */

function pickVoices() {
  const sel = document.getElementById('selVoice');
  const btn = document.getElementById('btnVoice');
  voices = TTS ? speechSynthesis.getVoices().filter(v => /^zh/i.test(v.lang)) : [];
  if (!voices.length && !REC) {
    sel.innerHTML = '<option>沒有中文語音</option>';
    sel.disabled = true; btn.disabled = true;
    btn.textContent = '🔇 此瀏覽器沒有中文語音';
    return;
  }
  // 偏好台灣的自然語音，其次任何 zh-TW，最後其他中文
  const score = v => (/zh-TW/i.test(v.lang) ? 4 : 0) +
                     (/Natural|Online/i.test(v.name) ? 2 : 0) +
                     (/HK|CN/i.test(v.lang) ? 0 : 1);
  voices.sort((a, b) => score(b) - score(a));
  sel.disabled = false; btn.disabled = false;
  // 語音是非同步載入的：第一次呼叫時清單可能還是空的，這裡要把按鈕文字改回來
  btn.textContent = voiceOn ? '🔊 配音：開' : '🔈 配音：關';
  const region = l => /TW/i.test(l) ? '台灣' : /HK/i.test(l) ? '香港' : /CN/i.test(l) ? '中國' : l;
  const label = v => v.name.replace(/^Microsoft\s*/, '')
                           .replace(/\s*Online \(Natural\)/, '（自然，需網路）')
                           .replace(/\s*-\s*Chinese.*$/, '')
                           .replace(/\s*Desktop$/, '') + (/Online/i.test(v.name) ? '' : '（離線）')
                           + '・' + region(v.lang);
  sel.innerHTML = (REC ? `<option value="rec">${REC_LABEL}</option>` : '') +
    voices.map((v, i) => `<option value="${i}">${label(v)}</option>`).join('');
  let want = REC ? 'rec' : '0';
  try {
    const saved = localStorage.getItem('w04voice2');
    if (saved === 'rec' && REC) want = 'rec';
    else if (saved && saved !== 'rec') {
      const j = voices.findIndex(v => v.name === saved);
      if (j >= 0) want = String(j);
    }
  } catch (e) {}
  sel.value = want;
  theVoice = (want === 'rec') ? 'rec' : voices[+want];
}

function stopMedia() {
  try { speechSynthesis.cancel(); } catch (e) {}
  if (audioEl) {
    audioEl.onended = audioEl.onerror = null;
    try { audioEl.pause(); } catch (e) {}
    audioEl = null;
  }
}
function stopSpeak() { speakSeq++; stopMedia(); }

/* 用瀏覽器語音唸一串句子 */
function ttsParts(parts, my, done) {
  const v = (theVoice && theVoice !== 'rec') ? theVoice : (voices[0] || null);
  if (!TTS || !v) { done(); return; }
  try { speechSynthesis.cancel(); } catch (e) {}
  let i = 0;
  const next = () => {
    if (my !== speakSeq) return;                        // 已被新的取代
    if (i >= parts.length) { done(); return; }
    const u = new SpeechSynthesisUtterance(parts[i++]);
    u.voice = v; u.lang = v.lang; u.rate = rate;
    u.onend = next;
    u.onerror = next;
    speechSynthesis.speak(u);
  };
  next();
}

/* 唸出目前這一步；唸完呼叫 done() */
function speakStep(done) {
  if (VIDEO || !voiceOn || !theVoice) { done && done(); return; }
  const my = ++speakSeq;
  stopMedia();
  const finish = () => { if (my === speakSeq) done && done(); };
  if (theVoice === 'rec') {
    const rec = REC && REC.steps[(si + 1) + '.' + step];
    if (rec && rec.t === stepText(si, step)) {
      let fell = false;
      const fallback = () => {                           // 音檔讀不到就改用瀏覽器語音
        if (fell || my !== speakSeq) return;
        fell = true; ttsParts(stepParts(si, step), my, finish);
      };
      audioEl = new Audio(REC.dir + rec.f);
      audioEl.playbackRate = rate;
      audioEl.onended = finish;
      audioEl.onerror = fallback;
      const p = audioEl.play();
      if (p && p.catch) p.catch(fallback);
      return;
    }
    // 這一步的旁白改過、或沒有對應的音檔 → 退回瀏覽器語音
  }
  ttsParts(stepParts(si, step), my, finish);
}

/* Chrome／Edge 長時間朗讀會自己停住，定期戳一下 */
if (TTS) setInterval(() => {
  if (voiceOn && speechSynthesis.speaking && !speechSynthesis.paused) {
    speechSynthesis.pause(); speechSynthesis.resume();
  }
}, 9000);

function setVoiceOn(v) {
  voiceOn = v;
  const b = document.getElementById('btnVoice');
  b.textContent = v ? '🔊 配音：開' : '🔈 配音：關';
  b.classList.toggle('on', v);
  try { localStorage.setItem('w04voiceon2', v ? '1' : '0'); } catch (e) {}
  if (!v) stopSpeak();
}

function manualGo(d){ stop(); go(d); speakStep(); }
function manualJump(i){ stop(); jump(i); speakStep(); }

/* 控制 */
document.getElementById('btnNext').addEventListener('click',()=>manualGo(1));
document.getElementById('btnPrev').addEventListener('click',()=>manualGo(-1));

document.getElementById('btnVoice').addEventListener('click',()=>{
  setVoiceOn(!voiceOn);
  if(voiceOn){ if(playing) tick(); else speakStep(); }
});
document.getElementById('selVoice').addEventListener('change',e=>{
  const v = e.target.value;
  theVoice = (v === 'rec') ? 'rec' : (voices[+v] || theVoice);
  try{ localStorage.setItem('w04voice2', theVoice === 'rec' ? 'rec' : theVoice.name); }catch(err){}
  if(voiceOn && !playing) speakStep();
});
document.getElementById('selRate').addEventListener('change',e=>{
  rate = +e.target.value;
  if(audioEl) audioEl.playbackRate = rate;            // 正在播的音檔也馬上變速
  try{ localStorage.setItem('w04rate', String(rate)); }catch(err){}
});
document.getElementById('btnPlay').addEventListener('click',()=>{ playing?stop():play(); });
document.getElementById('btnToc').addEventListener('click',()=>document.getElementById('toc').classList.add('open'));
document.getElementById('btnTocClose').addEventListener('click',()=>document.getElementById('toc').classList.remove('open'));
document.getElementById('toc').addEventListener('click',e=>{ if(e.target.id==='toc') e.currentTarget.classList.remove('open'); });

document.getElementById('btnTheme').addEventListener('click',()=>{
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur==='dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('w04theme', next); }catch(e){}
});
try{ const t=localStorage.getItem('w04theme'); if(t) document.documentElement.setAttribute('data-theme',t); }catch(e){}

window.addEventListener('keydown',e=>{
  if(e.target && /SELECT|INPUT/.test(e.target.tagName)) return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){ manualGo(1); e.preventDefault(); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){ manualGo(-1); e.preventDefault(); }
  else if(e.key===' '){ playing?stop():play(); e.preventDefault(); }
  else if(e.key==='ArrowDown'){ if(si<SCENES.length-1) manualJump(si+1); e.preventDefault(); }
  else if(e.key==='ArrowUp'){ if(si>0) manualJump(si-1); e.preventDefault(); }
  else if(e.key==='v'||e.key==='V'){ document.getElementById('btnVoice').click(); }
  else if(e.key==='Escape'){ document.getElementById('toc').classList.remove('open'); }
});

/* 啟動 */
if(VIDEO) document.body.classList.add('video');
if((TTS || REC) && !VIDEO){
  pickVoices();
  if(TTS) speechSynthesis.addEventListener('voiceschanged', pickVoices);
  try{
    const r = localStorage.getItem('w04rate');
    if(r){ rate = +r; document.getElementById('selRate').value = r; }
  }catch(e){}
  // 配音預設開啟；只有使用者自己按掉過才保持關閉。
  // 瀏覽器規定要等使用者第一次操作（按下一步、播放）才會出聲，所以打開頁面時不會突然開始唸。
  let on = true;
  try{ if(localStorage.getItem('w04voiceon2')==='0') on = false; }catch(e){}
  voiceOn = on;                                     // 語音清單晚到時，pickVoices 會照這個值更新按鈕
  if(!document.getElementById('btnVoice').disabled) setVoiceOn(on);
}else if(!TTS && !REC){
  const b = document.getElementById('btnVoice');
  b.disabled = true; b.textContent = '🔇 此瀏覽器不支援配音';
  document.getElementById('selVoice').style.display = 'none';
  document.getElementById('selRate').style.display = 'none';
}
step = 1;
readHash();
render();
if(VIDEO) requestAnimationFrame(fitVideo);
</script>
</body>
</html>
